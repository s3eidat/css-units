<body data-tool="css-units">
<main class="s3-main">
  <section class="s3-hero">
    <h1>CSS Units</h1>
    <p>Convert px, rem, em, pt, vw, vh and % with your own base size and viewport, and build fluid <code>clamp()</code> font sizes with a live preview.</p>
  </section>

  <section class="card stack">
    <h2>Context</h2>
    <div class="grid-4 cu-ctx">
      <label class="field">Root font size (px)
        <input class="input" id="root" type="number" min="1" step="any" value="16">
      </label>
      <label class="field">Parent font size (px, for em and %)
        <input class="input" id="parent" type="number" min="1" step="any" value="16">
      </label>
      <label class="field">Viewport width (px)
        <input class="input" id="vw" type="number" min="1" step="any" value="1440">
      </label>
      <label class="field">Viewport height (px)
        <input class="input" id="vh" type="number" min="1" step="any" value="900">
      </label>
    </div>
  </section>

  <section class="card stack mt">
    <h2>Convert</h2>
    <div class="row cu-conv">
      <label class="field grow">Value
        <input class="input cu-big" id="val" type="number" step="any" value="24">
      </label>
      <label class="field">Unit
        <select class="select cu-big" id="unit"></select>
      </label>
    </div>
    <div class="cu-res" id="res"></div>
  </section>

  <section class="card stack mt">
    <div class="row between">
      <h2>Fluid typography <code>clamp()</code></h2>
      <div class="seg" id="cunit" role="group" aria-label="Output unit">
        <button aria-pressed="true" data-v="rem">rem</button>
        <button aria-pressed="false" data-v="px">px</button>
      </div>
    </div>
    <div class="grid-4 cu-ctx">
      <label class="field">Smallest size (px)
        <input class="input" id="minSize" type="number" min="0" step="any" value="16">
      </label>
      <label class="field">Largest size (px)
        <input class="input" id="maxSize" type="number" min="0" step="any" value="32">
      </label>
      <label class="field">From viewport (px)
        <input class="input" id="minVp" type="number" min="0" step="any" value="320">
      </label>
      <label class="field">To viewport (px)
        <input class="input" id="maxVp" type="number" min="0" step="any" value="1280">
      </label>
    </div>
    <div class="row cu-clamp">
      <code class="cu-code grow" id="clamp"></code>
      <button class="btn small" id="copyClamp"><svg class="i"><use href="#i-copy"/></svg>Copy CSS</button>
    </div>
    <div class="cu-prev">
      <label class="field"><span>Preview at viewport width <span class="mono cu-pvl" id="pvLabel"></span></span>
        <input type="range" id="pv" min="320" max="1920" step="1" value="800">
      </label>
      <svg class="cu-chart" id="chart" viewBox="0 0 600 170" role="img" aria-label="Font size across viewport widths"></svg>
      <div class="cu-sample" id="sample" dir="auto">The quick brown fox jumps over the lazy dog</div>
    </div>
  </section>

  <section class="card stack mt">
    <h2>Common sizes <small id="tblInfo"></small></h2>
    <div class="tbl-wrap"><table class="tbl" id="tbl"></table></div>
  </section>
</main>
<script src="app.js"></script>
</body>
